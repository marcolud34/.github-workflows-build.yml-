name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear archivos del proyecto
        run: |
          cat > settings.gradle.kts <<'EOF_JARVIS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Jarvis"
          include(":app")
          EOF_JARVIS
          cat > build.gradle.kts <<'EOF_JARVIS'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_JARVIS
          cat > gradle.properties <<'EOF_JARVIS'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_JARVIS
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_JARVIS'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.marco.jarvis"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.marco.jarvis"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
          }
          EOF_JARVIS
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_JARVIS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:label="JARVIS"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF_JARVIS
          mkdir -p app/src/main/java/com/marco/jarvis
          cat > app/src/main/java/com/marco/jarvis/MainActivity.kt <<'EOF_JARVIS'
          package com.marco.jarvis

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.speech.tts.Voice
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.FastOutSlowInEasing
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.navigationBarsPadding
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.statusBarsPadding
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.Button
          import androidx.compose.material3.ButtonDefaults
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.DisposableEffect
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.math.PI
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlinx.coroutines.delay

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { JarvisScreen() }
              }
          }

          private val Cyan = Color(0xFF00E5FF)
          private val Blue = Color(0xFF2979FF)

          // Respuestas simples que funcionan sin internet (la IA llega en una etapa posterior)
          private fun answerFor(text: String): String {
              val t = text.lowercase(Locale("es", "AR"))
              return when {
                  t.isBlank() -> "No te escuché. Probá de nuevo."
                  t.contains("hola") -> "Hola. Soy Jarvis. ¿En qué te ayudo?"
                  t.contains("hora") ->
                      "Son las " + SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date()) + "."
                  t.contains("fecha") || t.contains("qué día") ->
                      "Hoy es " + SimpleDateFormat("EEEE d 'de' MMMM", Locale("es", "AR")).format(Date()) + "."
                  else -> "Te escuché: $text"
              }
          }

          private fun errorText(code: Int): String = when (code) {
              SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT ->
                  "No te escuché. Acercate al micrófono y probá de nuevo."
              SpeechRecognizer.ERROR_NETWORK, SpeechRecognizer.ERROR_NETWORK_TIMEOUT, SpeechRecognizer.ERROR_SERVER ->
                  "Necesito internet para entenderte (código $code)."
              SpeechRecognizer.ERROR_AUDIO -> "Problema con el micrófono (código $code)."
              SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "Falta el permiso del micrófono."
              SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> "El reconocedor está ocupado. Probá otra vez."
              else -> "No pude escucharte (código $code)."
          }

          @Composable
          fun JarvisScreen() {
              val context = LocalContext.current
              var level by remember { mutableFloatStateOf(0f) }
              var speaking by remember { mutableStateOf(false) }
              var userLine by remember { mutableStateOf("") }
              var reply by remember { mutableStateOf("Sistema en línea. Tocá HABLAR cuando quieras.") }
              var shown by remember { mutableIntStateOf(0) }
              var status by remember { mutableStateOf("EN ESPERA") }
              val ttsHolder = remember { mutableStateOf<TextToSpeech?>(null) }
              val prefs = remember { context.getSharedPreferences("jarvis", Context.MODE_PRIVATE) }
              var voices by remember { mutableStateOf<List<Voice>>(emptyList()) }
              var voiceName by remember { mutableStateOf(prefs.getString("voice", "") ?: "") }
              var pitch by remember { mutableFloatStateOf(prefs.getFloat("pitch", 0.8f)) }

              // Efecto máquina de escribir: el texto aparece mientras Jarvis habla
              LaunchedEffect(reply) {
                  shown = 0
                  for (i in 1..reply.length) {
                      shown = i
                      delay(55)
                  }
              }

              fun say(msg: String) {
                  reply = msg
                  val ok = ttsHolder.value?.speak(msg, TextToSpeech.QUEUE_FLUSH, null, "jarvis")
                  status = if (ok == TextToSpeech.SUCCESS) "RESPONDIENDO" else "EN ESPERA"
              }

              fun nextVoice() {
                  val e = ttsHolder.value ?: return
                  if (voices.isEmpty()) {
                      reply = "No encuentro otras voces en español en este celular."
                      return
                  }
                  val cur = voices.indexOfFirst { it.name == voiceName }
                  val idx = (cur + 1) % voices.size
                  val v = voices[idx]
                  voiceName = v.name
                  prefs.edit().putString("voice", v.name).apply()
                  e.setVoice(v)
                  say("Hola, soy Jarvis. Esta es la voz número ${idx + 1} de ${voices.size}.")
              }

              fun nextPitch() {
                  val opts = listOf(0.6f, 0.75f, 0.9f, 1.0f, 1.15f)
                  val i = opts.indexOfFirst { abs(it - pitch) < 0.01f }
                  pitch = opts[(i + 1) % opts.size]
                  prefs.edit().putFloat("pitch", pitch).apply()
                  ttsHolder.value?.setPitch(pitch)
                  say("Así suena este tono.")
              }

              // Voz de respuesta (texto a voz del sistema)
              DisposableEffect(Unit) {
                  var engine: TextToSpeech? = null
                  engine = TextToSpeech(context) { st ->
                      val e = engine
                      if (st == TextToSpeech.SUCCESS && e != null) {
                          var r = e.setLanguage(Locale("es", "AR"))
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              r = e.setLanguage(Locale("es", "ES"))
                          }
                          if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                              reply = "No tengo voz en español instalada. Revisá Ajustes, Texto a voz."
                          }
                          val esVoices = (e.voices ?: emptySet<Voice>())
                              .filter { it.locale.language == "es" }
                              .sortedBy { it.name }
                          voices = esVoices
                          val saved = esVoices.firstOrNull { it.name == voiceName }
                          if (saved != null) e.setVoice(saved)
                          e.setPitch(pitch)
                          e.setSpeechRate(0.95f)
                          e.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) { speaking = true }
                              override fun onDone(utteranceId: String?) { speaking = false; status = "EN ESPERA" }
                              @Deprecated("Deprecated in Java")
                              override fun onError(utteranceId: String?) { speaking = false }
                          })
                      } else if (st != TextToSpeech.SUCCESS) {
                          reply = "No pude iniciar la voz del celular."
                      }
                  }
                  ttsHolder.value = engine
                  onDispose { engine?.shutdown() }
              }

              // Reconocimiento de voz del sistema
              val recognizer = remember { SpeechRecognizer.createSpeechRecognizer(context) }
              DisposableEffect(recognizer) {
                  recognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { status = "ESCUCHANDO" }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {
                          level = ((rmsdB + 2f) / 12f).coerceIn(0f, 1f)
                      }
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() { status = "PROCESANDO"; level = 0f }
                      override fun onError(error: Int) {
                          level = 0f
                          status = "EN ESPERA"
                          reply = errorText(error)
                      }
                      override fun onResults(results: Bundle?) {
                          level = 0f
                          val text = results
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull().orEmpty()
                          userLine = text
                          say(answerFor(text))
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val t = partialResults
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull().orEmpty()
                          if (t.isNotBlank()) userLine = t
                      }
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  onDispose { recognizer.destroy() }
              }

              fun startListening() {
                  if (!SpeechRecognizer.isRecognitionAvailable(context)) {
                      reply = "Este celular no tiene reconocimiento de voz disponible."
                      return
                  }
                  ttsHolder.value?.stop()
                  speaking = false
                  userLine = ""
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "es-AR")
                      putExtra(RecognizerIntent.EXTRA_CALLING_PACKAGE, context.packageName)
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                  }
                  recognizer.cancel()
                  recognizer.startListening(intent)
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) startListening() else reply = "Falta el permiso del micrófono."
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Brush.verticalGradient(listOf(Color(0xFF000510), Color(0xFF001633))))
                      .statusBarsPadding()
                      .navigationBarsPadding()
                      .padding(horizontal = 20.dp, vertical = 12.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Top
              ) {
                  Text("J.A.R.V.I.S.", color = Cyan, fontSize = 24.sp, letterSpacing = 8.sp)

                  HoloCore(
                      level = level,
                      speaking = speaking,
                      modifier = Modifier.fillMaxWidth().height(300.dp)
                  )

                  Text(status, color = Blue, fontSize = 13.sp, letterSpacing = 3.sp)
                  Text(
                      text = "VOZ: " + (if (voiceName.isBlank()) "predeterminada" else voiceName) + "  ·  TONO " + pitch,
                      color = Color(0xFF4F7FA8),
                      fontSize = 10.sp
                  )
                  Spacer(Modifier.height(10.dp))

                  // Panel de texto: solo lectura, el usuario no puede escribir
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .background(Color(0x1400E5FF), RoundedCornerShape(12.dp))
                          .border(1.dp, Cyan.copy(alpha = 0.5f), RoundedCornerShape(12.dp))
                          .padding(14.dp)
                  ) {
                      Column(modifier = Modifier.verticalScroll(rememberScrollState())) {
                          if (userLine.isNotBlank()) {
                              Text(
                                  text = "TÚ  ›  $userLine",
                                  color = Color(0xFF7FA8C9),
                                  fontSize = 14.sp,
                                  fontFamily = FontFamily.Monospace
                              )
                              Spacer(Modifier.height(10.dp))
                          }
                          val cursor = if (shown < reply.length) "▌" else ""
                          Text(
                              text = "JARVIS  ›  " + reply.take(shown) + cursor,
                              color = Color.White,
                              fontSize = 16.sp,
                              fontFamily = FontFamily.Monospace
                          )
                      }
                  }

                  Spacer(Modifier.height(12.dp))
                  Button(
                      onClick = {
                          val ok = ContextCompat.checkSelfPermission(
                              context, Manifest.permission.RECORD_AUDIO
                          ) == PackageManager.PERMISSION_GRANTED
                          if (ok) startListening() else permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      },
                      colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Color(0xFF000510))
                  ) {
                      Text("HABLAR", fontSize = 16.sp, letterSpacing = 4.sp)
                  }
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      OutlinedButton(
                          onClick = { nextVoice() },
                          colors = ButtonDefaults.outlinedButtonColors(contentColor = Cyan)
                      ) { Text("CAMBIAR VOZ", fontSize = 12.sp, letterSpacing = 2.sp) }
                      OutlinedButton(
                          onClick = { nextPitch() },
                          colors = ButtonDefaults.outlinedButtonColors(contentColor = Cyan)
                      ) { Text("TONO", fontSize = 12.sp, letterSpacing = 2.sp) }
                  }
              }
          }

          @Composable
          fun HoloCore(level: Float, speaking: Boolean, modifier: Modifier = Modifier) {
              val transition = rememberInfiniteTransition(label = "holo")
              val spin by transition.animateFloat(
                  initialValue = 0f,
                  targetValue = 360f,
                  animationSpec = infiniteRepeatable(tween(20000, easing = LinearEasing)),
                  label = "spin"
              )
              val scan by transition.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(3200, easing = LinearEasing)),
                  label = "scan"
              )
              val pulse by transition.animateFloat(
                  initialValue = 0.94f,
                  targetValue = 1.06f,
                  animationSpec = infiniteRepeatable(tween(2200, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "pulse"
              )
              val wob by transition.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(380, easing = LinearEasing), RepeatMode.Reverse),
                  label = "wob"
              )
              val target = if (speaking) 0.35f + 0.5f * wob else level
              val smooth by animateFloatAsState(targetValue = target, animationSpec = tween(100), label = "level")

              Canvas(modifier = modifier) {
                  val c = center
                  val r = size.minDimension * 0.34f
                  val thin = Stroke(width = 1.2f.dp.toPx())
                  val grid = Cyan.copy(alpha = 0.55f)
                  val baseY = c.y + r * 1.3f

                  // cono de luz del proyector
                  val cone = Path().apply {
                      moveTo(c.x - r * 0.55f, baseY)
                      lineTo(c.x + r * 0.55f, baseY)
                      lineTo(c.x + r * 0.95f, c.y)
                      lineTo(c.x - r * 0.95f, c.y)
                      close()
                  }
                  drawPath(
                      path = cone,
                      brush = Brush.verticalGradient(
                          colors = listOf(Color(0x0000E5FF), Cyan.copy(alpha = 0.22f)),
                          startY = c.y,
                          endY = baseY
                      )
                  )

                  // base del proyector
                  for (i in 0..2) {
                      val w = r * (0.6f + i * 0.3f)
                      drawOval(
                          color = Cyan.copy(alpha = 0.6f - i * 0.17f),
                          topLeft = Offset(c.x - w, baseY - w * 0.14f),
                          size = Size(w * 2f, w * 0.28f),
                          style = thin
                      )
                  }

                  // esfera de rejilla (meridianos que giran)
                  val rad = spin * (PI.toFloat() / 180f)
                  for (k in 0 until 6) {
                      val a = rad + k * (PI.toFloat() / 6f)
                      val w = r * abs(cos(a))
                      if (w > 2f) {
                          drawOval(
                              color = grid,
                              topLeft = Offset(c.x - w, c.y - r),
                              size = Size(w * 2f, r * 2f),
                              style = thin
                          )
                      }
                  }
                  // paralelos
                  for (j in -2..2) {
                      val lat = j * (PI.toFloat() / 6f)
                      val y = c.y + r * sin(lat)
                      val rx = r * cos(lat)
                      drawOval(
                          color = grid,
                          topLeft = Offset(c.x - rx, y - rx * 0.18f),
                          size = Size(rx * 2f, rx * 0.36f),
                          style = thin
                      )
                  }
                  drawCircle(color = Cyan.copy(alpha = 0.9f), radius = r, center = c, style = thin)

                  // línea de escaneo
                  val sy = c.y - r + scan * 2f * r
                  val dy = sy - c.y
                  val hw = sqrt(maxOf(r * r - dy * dy, 0f))
                  drawLine(
                      color = Cyan.copy(alpha = 0.8f),
                      start = Offset(c.x - hw, sy),
                      end = Offset(c.x + hw, sy),
                      strokeWidth = 1.5f.dp.toPx()
                  )

                  // núcleo que reacciona a la voz
                  val coreR = r * 0.22f * pulse * (1f + smooth * 0.6f)
                  drawCircle(
                      brush = Brush.radialGradient(
                          colors = listOf(Color.White.copy(alpha = 0.95f), Cyan.copy(alpha = 0.6f), Color(0x0000B8FF)),
                          center = c,
                          radius = coreR * 3f
                      ),
                      radius = coreR * 3f,
                      center = c
                  )
                  drawCircle(color = Color.White, radius = coreR * 0.5f, center = c)

                  // anillos inclinados (efecto 3D)
                  for (i in 0..1) {
                      val rw = r * (1.25f + i * 0.2f)
                      val rh = rw * 0.28f
                      drawArc(
                          color = if (i == 0) Cyan else Blue,
                          startAngle = spin * (if (i == 0) 1f else -1.4f),
                          sweepAngle = 240f,
                          useCenter = false,
                          topLeft = Offset(c.x - rw, c.y - rh),
                          size = Size(rw * 2f, rh * 2f),
                          style = Stroke(width = 2.5f.dp.toPx(), cap = StrokeCap.Round)
                      )
                  }

                  // partículas flotando
                  for (p in 0 until 18) {
                      val ang = rad * (1 + p % 3) + p * 0.35f
                      val rr = r * (1.1f + (p % 5) * 0.08f)
                      drawCircle(
                          color = Cyan.copy(alpha = 0.6f),
                          radius = 1.8f.dp.toPx(),
                          center = Offset(c.x + rr * cos(ang), c.y + rr * sin(ang) * 0.5f)
                      )
                  }
              }
          }
          EOF_JARVIS
          base64 -d > app/debug.keystore <<'EOF_KEY'
